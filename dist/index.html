<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f1">
  <meta name="description" content="Agenda inteligente da Rb Clínica">
  <title>Rb Clínica — Agenda</title>
  <style>
    :root{--ice:#f4f4f1;--paper:#fffefd;--ink:#292825;--muted:#78756f;--line:#e9e6e0;--rose:#c98f89;--rose-dark:#a96e69;--blush:#f5e7e2;--sage:#dfe8df;--radius:22px;--shadow:0 12px 34px rgba(61,50,42,.08)}*{box-sizing:border-box}body{margin:0;background:var(--ice);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{max-width:720px;margin:auto;min-height:100dvh;padding-bottom:100px}.top{padding:24px 20px 15px;display:flex;justify-content:space-between;align-items:center}.brand{font-family:Georgia,serif;font-size:26px;letter-spacing:-1px}.brand small{display:block;font:600 10px/1.2 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--rose-dark);margin-top:3px}.avatar{width:40px;height:40px;border-radius:50%;background:var(--blush);color:var(--rose-dark);display:grid;place-items:center;font-weight:750}.hero{margin:0 16px 16px;background:var(--paper);border:1px solid #eeeae5;border-radius:var(--radius);padding:21px;box-shadow:var(--shadow)}.eyebrow{font-size:11px;color:var(--rose-dark);font-weight:800;letter-spacing:.1em;text-transform:uppercase}.hero h1{font-size:27px;letter-spacing:-1.1px;margin:8px 0 5px}.hero p{margin:0;color:var(--muted);font-size:13px}.date-jump{display:flex;align-items:center;justify-content:space-between;margin:0 16px 10px;padding:11px 13px;background:#ebe9e4;border:1px solid #e1ddd7;border-radius:14px;color:#4e4a45;font-size:12px;font-weight:750}.date-jump input{border:0;background:transparent;color:var(--rose-dark);font-weight:750;max-width:145px;min-height:28px}.days{display:flex;gap:9px;overflow:auto;padding:4px 16px 16px;scrollbar-width:none}.day{min-width:58px;background:transparent;border:1px solid var(--line);border-radius:17px;padding:10px 7px;color:var(--muted);text-align:center;font-size:11px}.day strong{display:block;font-size:18px;color:var(--ink);margin-top:3px}.day.active{background:var(--ink);border-color:var(--ink);color:#f7f3ee}.day.active strong{color:#fff}.section{padding:0 16px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:8px 0 11px}.section-head h2{font-size:17px;letter-spacing:-.5px;margin:0}.text-button{color:var(--rose-dark);background:none;font-size:12px;font-weight:750}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:20px}.stat{background:rgba(255,255,255,.65);border:1px solid var(--line);border-radius:16px;padding:13px}.stat span{font-size:10px;color:var(--muted)}.stat strong{display:block;margin-top:5px;font-size:17px;letter-spacing:-.6px}.agenda{display:flex;flex-direction:column;gap:10px}.appointment{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:49px 1fr auto;gap:11px;align-items:center;box-shadow:0 4px 18px rgba(61,50,42,.035);cursor:pointer}.appointment:focus-visible{outline:3px solid #d9a6a0;outline-offset:3px}.time{font-weight:800;font-size:13px}.time small{display:block;color:var(--muted);font-size:10px;font-weight:600;margin-top:3px}.who strong{font-size:14px}.who span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.confirm-btn{font-size:10px;padding:8px 10px;border-radius:999px;background:var(--blush);color:var(--rose-dark);font-weight:800;white-space:nowrap}.confirm-btn.confirmed,.pill.done{background:var(--sage);color:#4f7052}.pill{font-size:10px;padding:6px 8px;border-radius:999px;background:#f0efec;color:#716d67;font-weight:750}.empty{background:rgba(255,255,255,.55);border:1px dashed #d9d3cc;border-radius:18px;padding:25px;text-align:center;color:var(--muted);font-size:13px}.fab{position:fixed;bottom:23px;right:max(20px,calc((100vw - 720px)/2 + 20px));width:58px;height:58px;border-radius:50%;background:var(--rose-dark);color:white;font-size:29px;box-shadow:0 10px 22px rgba(169,110,105,.3)}.modal{position:fixed;inset:0;background:rgba(36,33,30,.35);z-index:5;display:flex;align-items:end}.sheet{background:var(--paper);width:min(720px,100%);max-height:92dvh;overflow:auto;border-radius:27px 27px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));animation:up .2s ease}.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:19px}.sheet h2{margin:0;font-size:21px;letter-spacing:-.8px}.close{background:#f3f0ec;width:33px;height:33px;border-radius:50%;font-size:18px}.fields{display:grid;gap:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field label{display:block;font-size:11px;font-weight:750;margin:0 0 6px}.field input,.field select{width:100%;height:48px;border:1px solid var(--line);border-radius:13px;background:#fff;padding:0 12px;color:var(--ink);outline-color:var(--rose)}.payment{display:flex;gap:8px;flex-wrap:wrap}.pay{padding:10px 12px;background:#f6f3f0;border-radius:11px;color:#66615c;font-size:12px}.pay.selected{background:var(--blush);color:var(--rose-dark);outline:1px solid #ddb2ad}.save{width:100%;height:52px;background:var(--ink);color:white;border-radius:14px;font-weight:750;margin-top:20px}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#302d2a;color:white;border-radius:999px;padding:11px 16px;font-size:12px;box-shadow:var(--shadow);z-index:20}.hidden{display:none}@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:translateY(0);opacity:1}}@media(min-width:680px){.top{padding-top:35px}.hero{margin-top:6px}.fab{right:calc((100vw - 680px)/2)}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
  </style>
<style>
  :root{--ink:#29231f;--rose:#c88982;--rose-dark:#a2645e;--paper:#fffdf9;--ice:#f1efec;--gold:#b79b72;--plum:#745c6c;--sage:#d9e4d6}
  body{background:radial-gradient(circle at 92% -8%,#f0d9d2 0,transparent 25%),radial-gradient(circle at -8% 20%,#dde4dc 0,transparent 24%),var(--ice)}
  .app{max-width:760px;padding-bottom:116px}.top{padding:27px 22px 17px}.brand{font-size:29px}.brand small{color:var(--gold);letter-spacing:.18em}.avatar{width:45px;height:45px;background:var(--ink);color:#fff3e9;border:3px solid #f5e8e1;box-shadow:0 5px 18px rgba(61,45,37,.18)}
  .hero{position:relative;overflow:hidden;margin:0 16px 13px;padding:25px 23px 23px;border:0;background:linear-gradient(138deg,#342a27,#4a3935);color:#fff8f2;box-shadow:0 16px 38px rgba(70,49,42,.18)}.hero:before{content:"";position:absolute;width:215px;height:215px;border:1px solid rgba(243,214,202,.22);border-radius:50%;right:-70px;top:-92px}.hero:after{content:"";position:absolute;width:122px;height:122px;border-radius:50%;background:rgba(205,143,137,.16);right:26px;bottom:-55px}.hero .eyebrow{color:#efc5bd;position:relative;z-index:1}.hero h1{position:relative;z-index:1;font-family:Georgia,serif;font-weight:500;font-size:31px;line-height:1.04;margin:11px 0 7px}.hero p{position:relative;z-index:1;color:#e7d7d0;max-width:255px;line-height:1.45}.pulse{position:relative;z-index:1;display:flex;align-items:center;gap:8px;margin-top:20px;font-size:11px;color:#e9c7be;font-weight:700}.pulse i{width:8px;height:8px;background:#d6b277;border-radius:50%;box-shadow:0 0 0 5px rgba(214,178,119,.16)}
  .date-jump{margin:0 16px 13px;background:rgba(255,253,249,.74);border:1px solid rgba(189,168,151,.35);box-shadow:0 5px 18px rgba(76,58,45,.045);padding:12px 14px}.date-jump span:before{content:"⌁";color:var(--rose-dark);font-size:18px;margin-right:8px}.date-jump input{color:var(--ink)}
  .days{padding:3px 16px 18px;gap:8px}.day{min-width:60px;background:rgba(255,255,255,.46);border-color:transparent;border-radius:18px}.day.active{background:var(--rose-dark);box-shadow:0 8px 18px rgba(162,100,94,.23)}
  .daily-pulse{margin:0 16px 21px;padding:16px 17px;display:flex;align-items:center;gap:13px;border-radius:18px;background:rgba(255,253,249,.76);border:1px solid rgba(211,194,179,.5)}.daily-pulse .sun{width:39px;height:39px;border-radius:13px;display:grid;place-items:center;background:#f4e6ce;color:#967445;font-size:19px}.daily-pulse strong{display:block;font-size:13px}.daily-pulse span{display:block;color:var(--muted);font-size:11px;margin-top:3px}.daily-pulse b{margin-left:auto;font:600 10px Inter,sans-serif;letter-spacing:.08em;color:var(--rose-dark);text-transform:uppercase}
  .section{padding:0 16px}.stats{gap:10px;margin-bottom:25px}.stat{position:relative;overflow:hidden;background:rgba(255,253,249,.75);border:1px solid rgba(218,207,197,.6);border-radius:18px;padding:14px 13px}.stat:after{content:"";position:absolute;width:30px;height:30px;border-radius:50%;right:-12px;top:-12px;background:var(--blush)}.stat:nth-child(2):after{background:var(--sage)}.stat:nth-child(3):after{background:#eee0c9}.stat strong{font-size:18px}.section-head{margin-bottom:13px}.section-head h2{font-family:Georgia,serif;font-size:21px;font-weight:500}.text-button{padding:7px 10px;border-radius:999px;background:rgba(255,253,249,.75);border:1px solid var(--line)}
  .agenda{gap:11px}.appointment{grid-template-columns:47px 1fr auto;padding:13px;background:rgba(255,253,249,.92);border-color:rgba(219,207,196,.67);border-radius:19px;box-shadow:0 8px 22px rgba(75,57,47,.05)}.time{font-size:12px;color:var(--rose-dark)}.client-initial{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;background:#eee1db;color:#8d5e59;font-size:11px;font-weight:850}.who strong{font-size:14px}.who span{font-size:10px;letter-spacing:.01em}.confirm-btn{background:var(--ink);color:#fff8f1;padding:8px 11px}.pill{background:#eee9e2}.empty{background:rgba(255,253,249,.55)}.fab{width:60px;height:60px;background:var(--rose-dark);border:4px solid #f5e9e4;box-shadow:0 12px 24px rgba(162,100,94,.34)}
  .sheet{border-radius:30px 30px 0 0;background:#fffcf9}.save{background:var(--rose-dark)}
  .who{display:grid;grid-template-columns:38px 1fr;column-gap:10px;align-items:center}.who .client-initial{grid-row:1/3}.who strong,.who span{min-width:0}.client-initial{background:linear-gradient(135deg,#f5e4dd,#ead0c9)!important;color:#875955!important;box-shadow:inset 0 0 0 1px rgba(151,103,96,.12)}
</style>
</head>
<body><main class="app"><header class="top"><div class="brand">Rb Clínica<small>agenda do salão</small></div><div class="avatar">RB</div></header><section class="hero"><span class="eyebrow" id="todayLabel">Hoje</span><h1 id="headline">Sua agenda está leve.</h1><p id="subtitle">Organize o dia em poucos toques.</p><div class="pulse"><i></i><span id="dayNote">Um dia para cuidar de cada detalhe.</span></div></section><label class="date-jump" for="datePicker"><span>Escolher outra data</span><input id="datePicker" type="date" aria-label="Escolha qualquer dia da agenda"></label><nav class="days" id="days" aria-label="Selecione o dia"></nav><aside class="daily-pulse" id="dailyPulse"><div class="sun">✦</div><div><strong>Ritmo do dia</strong><span id="pulseCopy">Sua agenda tem espaço para respirar.</span></div><b id="pulseState">calmo</b></aside><section class="section"><div class="stats"><div class="stat"><span>Atendimentos</span><strong id="count">0</strong></div><div class="stat"><span>Confirmados</span><strong id="confirmed">0</strong></div><div class="stat"><span>Previsto</span><strong id="revenue">R$ 0</strong></div></div><div class="section-head"><h2>Agenda do dia</h2><button class="text-button" id="clearBtn">Hoje</button></div><div class="agenda" id="agenda"></div></section></main><button class="fab" id="newBtn" aria-label="Novo agendamento">+</button><div class="modal hidden" id="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle"><form class="sheet" id="form"><div class="sheet-header"><h2 id="formTitle">Novo agendamento</h2><button class="close" type="button" id="closeBtn" aria-label="Fechar">×</button></div><input type="hidden" id="id"><div class="fields"><div class="row"><div class="field"><label for="date">Data</label><input id="date" type="date" required></div><div class="field"><label for="time">Horário</label><input id="time" type="time" required></div></div><div class="field"><label for="client">Cliente</label><input id="client" placeholder="Nome da cliente" required maxlength="80"></div><div class="row"><div class="field"><label for="service">Serviço</label><select id="service"><option>Escova</option><option>Corte feminino</option><option>Coloração</option><option>Hidratação</option><option>Manicure</option><option>Outro</option></select></div><div class="field"><label for="professional">Profissional</label><select id="professional"><option>Ana</option><option>Bianca</option><option>Camila</option><option>Outro profissional</option></select></div></div><div class="row"><div class="field"><label for="duration">Duração</label><select id="duration"><option value="30">30 min</option><option value="60" selected>1 hora</option><option value="90">1h30</option><option value="120">2 horas</option></select></div><div class="field"><label for="price">Valor (R$)</label><input id="price" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0,00" required></div></div><div class="field"><label>Forma de pagamento</label><div class="payment" id="payments"><button class="pay selected" type="button" data-pay="Pix">Pix</button><button class="pay" type="button" data-pay="Cartão">Cartão</button><button class="pay" type="button" data-pay="Dinheiro">Dinheiro</button></div></div><div class="field"><label for="status">Status</label><select id="status"><option>Agendado</option><option>Confirmado</option><option>Concluído</option><option>Cancelado</option></select></div></div><button class="save" type="submit">Salvar agendamento</button></form></div><div class="toast hidden" id="toast"></div><script>
const KEY='rb-clinica-agenda-v1';const $=id=>document.getElementById(id);const dayISO=o=>{let d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+o);return d.toISOString().slice(0,10)};let selected=dayISO(0),payment='Pix',items=JSON.parse(localStorage.getItem(KEY)||'[]');
function money(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(v||0)}function save(){localStorage.setItem(KEY,JSON.stringify(items))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function selectedLabel(){return new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date(selected+'T12:00'))}function renderDays(){let fmt=new Intl.DateTimeFormat('pt-BR',{weekday:'short',day:'numeric'});$('days').innerHTML=[-2,-1,0,1,2,3,4].map(o=>{let d=dayISO(o),p=fmt.format(new Date(d+'T12:00')).replace('.','');let [w,n]=p.split(' ');return `<button class="day ${d===selected?'active':''}" data-day="${d}">${w}<strong>${n}</strong></button>`}).join('')}function render(){renderDays();$('datePicker').value=selected;$('todayLabel').textContent=selectedLabel();let list=items.filter(x=>x.date===selected&&x.status!=='Cancelado').sort((a,b)=>a.time.localeCompare(b.time));let done=list.filter(x=>x.status==='Confirmado'||x.status==='Concluído');$('count').textContent=list.length;$('confirmed').textContent=done.length;$('revenue').textContent=money(list.reduce((s,x)=>s+Number(x.price),0));$('headline').textContent=list.length?`${list.length} atendimento${list.length>1?'s':''} no seu ritmo.`:'Sua agenda está leve.';$('subtitle').textContent=list.length?'Toque no atendimento para editar ou em Confirmar para marcar a cliente.':'Comece registrando o primeiro horário.';$('agenda').innerHTML=list.length?list.map(x=>`<div class="appointment" data-id="${x.id}" role="button" tabindex="0" aria-label="Editar atendimento de ${esc(x.client)}"><div class="time">${x.time}<small>${x.duration} min</small></div><div class="who"><strong>${esc(x.client)}</strong><span>${esc(x.service)} · ${esc(x.professional)}</span></div>${x.status==='Agendado'?`<button class="confirm-btn" type="button" data-confirm="${x.id}" aria-label="Confirmar atendimento de ${esc(x.client)}">Confirmar</button>`:`<span class="pill ${x.status==='Concluído'?'done':''}">${x.status}</span>`}</div>`).join(''):'<div class="empty">Nenhum atendimento neste dia.<br>Use o botão + para criar um horário.</div>'}function open(item){$('modal').classList.remove('hidden');$('formTitle').textContent=item?'Editar agendamento':'Novo agendamento';$('id').value=item?.id||'';$('date').value=item?.date||selected;$('time').value=item?.time||'09:00';$('client').value=item?.client||'';$('service').value=item?.service||'Escova';$('professional').value=item?.professional||'Ana';$('duration').value=item?.duration||'60';$('price').value=item?.price||'';$('status').value=item?.status||'Agendado';payment=item?.payment||'Pix';document.querySelectorAll('.pay').forEach(b=>b.classList.toggle('selected',b.dataset.pay===payment));setTimeout(()=>$('client').focus(),50)}function close(){$('modal').classList.add('hidden')}function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),2200)}$('newBtn').onclick=()=>open();$('closeBtn').onclick=close;$('modal').onclick=e=>{if(e.target===$('modal'))close()};$('datePicker').onchange=e=>{if(e.target.value){selected=e.target.value;render()}};$('days').onclick=e=>{let b=e.target.closest('[data-day]');if(b){selected=b.dataset.day;render()}};$('agenda').onclick=e=>{let confirm=e.target.closest('[data-confirm]');if(confirm){let id=confirm.dataset.confirm;items=items.map(x=>x.id===id?{...x,status:'Confirmado'}:x);save();render();toast('Cliente confirmada');return}let b=e.target.closest('[data-id]');if(b)open(items.find(x=>x.id===b.dataset.id))};$('agenda').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('appointment')){e.preventDefault();open(items.find(x=>x.id===e.target.dataset.id))}};$('payments').onclick=e=>{let b=e.target.closest('[data-pay]');if(b){payment=b.dataset.pay;document.querySelectorAll('.pay').forEach(x=>x.classList.toggle('selected',x===b))}};$('form').onsubmit=e=>{e.preventDefault();let id=$('id').value;let record={id:id||crypto.randomUUID(),date:$('date').value,time:$('time').value,client:$('client').value.trim(),service:$('service').value,professional:$('professional').value,duration:$('duration').value,price:Number($('price').value),payment,status:$('status').value};if(id)items=items.map(x=>x.id===id?record:x);else items.push(record);selected=record.date;save();close();render();toast(id?'Agendamento atualizado':'Horário agendado')};$('clearBtn').onclick=()=>{selected=dayISO(0);render()};render();
</script><script>
function clientInitials(name){return String(name||'').trim().split(/\s+/).slice(0,2).map(v=>v[0]||'').join('').toUpperCase()||'RB'}
const baseRender=render;
render=function(){baseRender();const appointments=[...document.querySelectorAll('.appointment')];appointments.forEach(card=>{const customer=card.querySelector('.who strong');if(customer&&!card.querySelector('.client-initial')){const monogram=document.createElement('div');monogram.className='client-initial';monogram.textContent=clientInitials(customer.textContent);card.querySelector('.who').prepend(monogram)}});const total=appointments.length;const confirmed=appointments.filter(card=>!card.querySelector('[data-confirm]')).length;const note=document.getElementById('dayNote'),copy=document.getElementById('pulseCopy'),state=document.getElementById('pulseState');if(note)note.textContent=total?`${confirmed} de ${total} atendimentos já estão confirmados.`:'Um dia para cuidar de cada detalhe.';if(copy)copy.textContent=total?`Você tem ${total} ${total===1?'momento reservado':'momentos reservados'} hoje.`:'Sua agenda tem espaço para respirar.';if(state)state.textContent=total>5?'intenso':total?'em fluxo':'calmo'};
render();
</script></body></html>
